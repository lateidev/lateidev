name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p generated

          python3 <<'PY'
          import urllib.request
          import json

          username = "lateidev"

          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "lateidev-stats"
          }

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          user = get(f"https://api.github.com/users/{username}")

          repos = get(
              f"https://api.github.com/users/{username}/repos?per_page=100"
          )

          total_stars = sum(
              repo.get("stargazers_count", 0)
              for repo in repos
          )

          languages = {}

          for repo in repos:
              if repo.get("fork"):
                  continue

              lang_data = get(
                  f"https://api.github.com/repos/{username}/{repo['name']}/languages"
              )

              for language, amount in lang_data.items():
                  languages[language] = languages.get(language, 0) + amount

          total_bytes = sum(languages.values())

          language_data = []

          if total_bytes:
              for language, amount in sorted(
                  languages.items(),
                  key=lambda x: x[1],
                  reverse=True
              )[:8]:
                  percentage = amount / total_bytes * 100
                  language_data.append((language, percentage))

          stats_svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="760" height="240">
          <rect width="760" height="240" rx="14" fill="#000000"/>

          <text x="35" y="48"
                fill="#C0C0C0"
                font-family="Arial"
                font-size="24"
                font-weight="bold">
            GitHub Statistics
          </text>

          <text x="35" y="95"
                fill="#FFFFFF"
                font-family="Arial"
                font-size="15">
            Repositories
          </text>

          <text x="35" y="130"
                fill="#C0C0C0"
                font-family="Arial"
                font-size="30"
                font-weight="bold">
            {user["public_repos"]}
          </text>

          <text x="275" y="95"
                fill="#FFFFFF"
                font-family="Arial"
                font-size="15">
            Followers
          </text>

          <text x="275" y="130"
                fill="#C0C0C0"
                font-family="Arial"
                font-size="30"
                font-weight="bold">
            {user["followers"]}
          </text>

          <text x="515" y="95"
                fill="#FFFFFF"
                font-family="Arial"
                font-size="15">
            Stars
          </text>

          <text x="515" y="130"
                fill="#C0C0C0"
                font-family="Arial"
                font-size="30"
                font-weight="bold">
            {total_stars}
          </text>

          <line x1="35" y1="165" x2="725" y2="165"
                stroke="#333333"/>

          <text x="35" y="202"
                fill="#888888"
                font-family="monospace"
                font-size="14">
            @lateidev
          </text>

          <text x="610" y="202"
                fill="#888888"
                font-family="monospace"
                font-size="14">
            ONLINE
          </text>
          </svg>'''

          with open("generated/github-stats.svg", "w") as f:
              f.write(stats_svg)

          bars = ""

          y = 55

          for language, percentage in language_data:
              bar_width = percentage * 5

              bars += f'''
              <text x="35" y="{y}"
                    fill="#FFFFFF"
                    font-family="Arial"
                    font-size="15">
                {language}
              </text>

              <rect x="150" y="{y-14}"
                    width="500"
                    height="16"
                    rx="8"
                    fill="#222222"/>

              <rect x="150" y="{y-14}"
                    width="{bar_width}"
                    height="16"
                    rx="8"
                    fill="#C0C0C0"/>

              <text x="670" y="{y}"
                    fill="#C0C0C0"
                    font-family="Arial"
                    font-size="14"
                    text-anchor="end">
                {percentage:.1f}%
              </text>
              '''

              y += 38

          height = max(180, y + 20)

          languages_svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
          width="760"
          height="{height}">

          <rect width="760"
                height="{height}"
                rx="14"
                fill="#000000"/>

          <text x="35" y="32"
                fill="#C0C0C0"
                font-family="Arial"
                font-size="22"
                font-weight="bold">
            Top Languages
          </text>

          {bars}

          </svg>'''

          with open("generated/top-languages.svg", "w") as f:
              f.write(languages_svg)
          PY

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add generated/

          git diff --cached --quiet || git commit -m "Update GitHub stats"

          git push
