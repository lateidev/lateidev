name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p generated

          python3 <<'PY'
          import urllib.request
          import json
          import html

          username = "lateidev"

          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "lateidev-stats"
          }

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          # GitHub user info
          user = get(f"https://api.github.com/users/{username}")
          repos = get(f"https://api.github.com/users/{username}/repos?per_page=100")

          total_stars = sum(repo.get("stargazers_count", 0) for repo in repos)

          # Languages
          languages = {}
          for repo in repos:
              if repo.get("fork"):
                  continue
              try:
                  lang_data = get(f"https://api.github.com/repos/{username}/{repo['name']}/languages")
                  for language, amount in lang_data.items():
                      languages[language] = languages.get(language, 0) + amount
              except Exception:
                  continue

          total_bytes = sum(languages.values())
          language_data = []

          if total_bytes:
              for language, amount in sorted(languages.items(), key=lambda x: x[1], reverse=True)[:8]:
                  percentage = (amount / total_bytes) * 100
                  language_data.append((language, percentage))

          # Colors
          WHITE = "#FFFFFF"
          BLACK = "#000000"
          SILVER = "#C0C0C0"
          DARK_SILVER = "#888888"
          LIGHT_GRAY = "#E5E5E5"
          BAR_BG = "#EEEEEE"

          # GITHUB STATS SVG
          stats_svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
            <defs>
              <linearGradient id="silverGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#888888"/>
                <stop offset="50%" stop-color="#C0C0C0"/>
                <stop offset="100%" stop-color="#888888"/>
              </linearGradient>
              <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
              </filter>
            </defs>

            <rect x="5" y="5" width="890" height="290" rx="22" fill="{WHITE}" stroke="{LIGHT_GRAY}" stroke-width="2" filter="url(#shadow)"/>
            <path d="M5 55 C120 15 190 85 310 45 C430 5 520 75 650 40 C760 10 820 45 895 20 L895 5 L5 5 Z" fill="url(#silverGradient)"/>

            <text x="45" y="105" fill="{BLACK}" font-family="Arial, sans-serif" font-size="28" font-weight="700">GitHub Statistics</text>
            <text x="45" y="132" fill="{DARK_SILVER}" font-family="monospace" font-size="13">@lateidev / github activity</text>

            <line x1="45" y1="155" x2="855" y2="155" stroke="{LIGHT_GRAY}" stroke-width="2"/>

            <text x="70" y="195" fill="{DARK_SILVER}" font-family="Arial, sans-serif" font-size="14">REPOSITORIES</text>
            <text x="70" y="235" fill="{BLACK}" font-family="Arial, sans-serif" font-size="34" font-weight="700">{user.get("public_repos", 0)}</text>

            <text x="350" y="195" fill="{DARK_SILVER}" font-family="Arial, sans-serif" font-size="14">FOLLOWERS</text>
            <text x="350" y="235" fill="{BLACK}" font-family="Arial, sans-serif" font-size="34" font-weight="700">{user.get("followers", 0)}</text>

            <text x="630" y="195" fill="{DARK_SILVER}" font-family="Arial, sans-serif" font-size="14">TOTAL STARS</text>
            <text x="630" y="235" fill="{BLACK}" font-family="Arial, sans-serif" font-size="34" font-weight="700">{total_stars}</text>

            <path d="M5 270 C120 240 190 295 310 260 C430 225 520 285 650 255 C760 230 820 265 895 240 L895 295 L5 295 Z" fill="url(#silverGradient)"/>
          </svg>'''

          with open("generated/github-stats.svg", "w", encoding="utf-8") as f:
              f.write(stats_svg)

          # TOP LANGUAGES SVG
          bars = ""
          y = 95

          for language, percentage in language_data:
              bar_width = min(600, max(5, percentage * 6))
              safe_language = html.escape(language)

              bars += f'''
              <text x="55" y="{y}" fill="{BLACK}" font-family="Arial, sans-serif" font-size="15" font-weight="600">{safe_language}</text>
              <rect x="190" y="{y - 15}" width="600" height="18" rx="9" fill="{BAR_BG}"/>
              <rect x="190" y="{y - 15}" width="{bar_width}" height="18" rx="9" fill="{SILVER}"/>
              <text x="835" y="{y}" fill="{DARK_SILVER}" font-family="monospace" font-size="14" text-anchor="end">{percentage:.1f}%</text>
              '''
              y += 45

          height = max(300, y + 65)
          card_height = height - 10
          b_y1 = height - 40
          b_y2 = height - 70
          b_y3 = height - 15
          b_y4 = height - 50
          b_y5 = height - 85
          b_y6 = height - 25
          b_y7 = height - 55
          b_y8 = height - 80
          b_y9 = height - 45
          b_y10 = height - 70
          b_y11 = height - 5

          languages_svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="900" height="{height}" viewBox="0 0 900 {height}">
            <defs>
              <linearGradient id="silverGradientLang" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#888888"/>
                <stop offset="50%" stop-color="#C0C0C0"/>
                <stop offset="100%" stop-color="#888888"/>
              </linearGradient>
              <filter id="shadowLang" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
              </filter>
            </defs>

            <rect x="5" y="5" width="890" height="{card_height}" rx="22" fill="{WHITE}" stroke="{LIGHT_GRAY}" stroke-width="2" filter="url(#shadowLang)"/>
            <path d="M5 55 C120 15 190 85 310 45 C430 5 520 75 650 40 C760 10 820 45 895 20 L895 5 L5 5 Z" fill="url(#silverGradientLang)"/>

            <text x="45" y="105" fill="{BLACK}" font-family="Arial, sans-serif" font-size="28" font-weight="700">Top Languages</text>
            <text x="45" y="132" fill="{DARK_SILVER}" font-family="monospace" font-size="13">@lateidev / language distribution</text>

            {bars}

            <path d="M5 {b_y1} C120 {b_y2} 190 {b_y3} 310 {b_y4} C430 {b_y5} 520 {b_y6} 650 {b_y7} C760 {b_y8} 820 {b_y9} 895 {b_y10} L895 {b_y11} L5 {b_y11} Z" fill="url(#silverGradientLang)"/>
          </svg>'''

          with open("generated/top-languages.svg", "w", encoding="utf-8") as f:
              f.write(languages_svg)

          print("Stats successfully generated!")
          PY

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/
          git diff --cached --quiet || git commit -m "Update GitHub stats"
          git push
