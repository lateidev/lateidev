name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p generated

          python3 <<'PY'
          import urllib.request
          import json
          import html

          username = "lateidev"

          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "lateidev-stats"
          }

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          # GitHub user info
          user = get(f"https://api.github.com/users/{username}")
          repos = get(f"https://api.github.com/users/{username}/repos?per_page=100")

          total_stars = sum(repo.get("stargazers_count", 0) for repo in repos)

          # Languages
          languages = {}
          for repo in repos:
              if repo.get("fork"):
                  continue
              try:
                  lang_data = get(f"https://api.github.com/repos/{username}/{repo['name']}/languages")
                  for language, amount in lang_data.items():
                      languages[language] = languages.get(language, 0) + amount
              except Exception:
                  continue

          total_bytes = sum(languages.values())
          language_data = []

          if total_bytes:
              for language, amount in sorted(languages.items(), key=lambda x: x[1], reverse=True)[:8]:
                  percentage = (amount / total_bytes) * 100
                  language_data.append((language, percentage))

          # ---------------------------------------------------------
          # GITHUB STATS SVG
          # ---------------------------------------------------------
          stats_svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
            <rect x="0" y="0" width="900" height="300" fill="#FFFFFF"/>
            <defs>
              <linearGradient id="silverGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#888888"/>
                <stop offset="50%" stop-color="#C0C0C0"/>
                <stop offset="100%" stop-color="#888888"/>
              </linearGradient>
            </defs>

            <rect x="5" y="5" width="890" height="290" rx="22" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
            <path d="M5 55 C120 15 190 85 310 45 C430 5 520 75 650 40 C760 10 820 45 895 20 L895 5 L5 5 Z" fill="url(#silverGradient)"/>

            <text x="45" y="105" fill="#000000" font-family="sans-serif" font-size="28" font-weight="700">GitHub Statistics</text>
            <text x="45" y="132" fill="#888888" font-family="monospace" font-size="13">@lateidev / github activity</text>

            <line x1="45" y1="155" x2="855" y2="155" stroke="#E5E5E5" stroke-width="2"/>

            <text x="70" y="195" fill="#888888" font-family="sans-serif" font-size="14">REPOSITORIES</text>
            <text x="70" y="235" fill="#000000" font-family="sans-serif" font-size="34" font-weight="700">{user.get("public_repos", 0)}</text>

            <text x="350" y="195" fill="#888888" font-family="sans-serif" font-size="14">FOLLOWERS</text>
            <text x="350" y="235" fill="#000000" font-family="sans-serif" font-size="34" font-weight="700">{user.get("followers", 0)}</text>

            <text x="630" y="195" fill="#888888" font-family="sans-serif" font-size="14">TOTAL STARS</text>
            <text x="630" y="235" fill="#000000" font-family="sans-serif" font-size="34" font-weight="700">{total_stars}</text>

            <path d="M5 270 C120 240 190 295 310 260 C430 225 520 285 650 255 C760 230 820 265 895 240 L895 295 L5 295 Z" fill="url(#silverGradient)"/>
          </svg>'''

          with open("generated/github-stats.svg", "w", encoding="utf-8") as f:
              f.write(stats_svg)

          # ---------------------------------------------------------
          # TOP LANGUAGES SVG (GitHub Uyumlu Yapı)
          # ---------------------------------------------------------
          bars = ""
          y = 150

          for language, percentage in language_data:
              bar_width = min(600, max(12, percentage * 6))
              safe_language = html.escape(language)

              bars += f'''
              <text x="55" y="{y}" fill="#000000" font-family="sans-serif" font-size="15" font-weight="600">{safe_language}</text>
              <rect x="190" y="{y - 14}" width="600" height="16" rx="8" fill="#EEEEEE"/>
              <rect x="190" y="{y - 14}" width="{bar_width}" height="16" rx="8" fill="#C0C0C0"/>
              <text x="835" y="{y}" fill="#888888" font-family="monospace" font-size="14" text-anchor="end">{percentage:.1f}%</text>
              '''
              y += 45

          num_langs = max(1, len(language_data))
          height = 160 + (num_langs * 45) + 60
          card_height = height - 10

          b_y1 = height - 35
          b_y2 = height - 60
          b_y3 = height - 10
          b_y4 = height - 40
          b_y5 = height - 70
          b_y6 = height - 20
          b_y7 = height - 45
          b_y8 = height - 65
          b_y9 = height - 35
          b_y10 = height - 55
          b_y11 = height - 5

          languages_svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="900" height="{height}" viewBox="0 0 900 {height}">
            <rect x="0" y="0" width="900" height="{height}" fill="#FFFFFF"/>
            <defs>
              <linearGradient id="silverGradientLang" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#888888"/>
                <stop offset="50%" stop-color="#C0C0C0"/>
                <stop offset="100%" stop-color="#888888"/>
              </linearGradient>
            </defs>

            <rect x="5" y="5" width="890" height="{card_height}" rx="22" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
            <path d="M5 45 C120 15 190 70 310 35 C430 5 520 60 650 30 C760 10 820 35 895 15 L895 5 L5 5 Z" fill="url(#silverGradientLang)"/>

            <text x="45" y="75" fill="#000000" font-family="sans-serif" font-size="28" font-weight="700">Top Languages</text>
            <text x="45" y="100" fill="#888888" font-family="monospace" font-size="13">@lateidev / language distribution</text>
            <line x1="45" y1="115" x2="855" y2="115" stroke="#E5E5E5" stroke-width="2"/>

            {bars}

            <path d="M5 {b_y1} C120 {b_y2} 190 {b_y3} 310 {b_y4} C430 {b_y5} 520 {b_y6} 650 {b_y7} C760 {b_y8} 820 {b_y9} 895 {b_y10} L895 {b_y11} L5 {b_y11} Z" fill="url(#silverGradientLang)"/>
          </svg>'''

          with open("generated/top-languages.svg", "w", encoding="utf-8") as f:
              f.write(languages_svg)

          print("Stats successfully generated!")
          PY

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/
          git diff --cached --quiet || git commit -m "Update GitHub stats"
          git push
